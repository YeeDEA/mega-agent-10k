simulation:
  duration_days: 1
  timestep_minutes: 60

agents:
  total: 10000
  new_group_percent: 3
  groups:
    Catalysts:
      size: 800
      amplification_factor: 1.5
    Guardians:
      size: 600
      suppression_threshold: 0.2
    Explorers:
      size: 500
      seed_interval_hours: 12
    Collaborators:
      size: 700
    Regulators:
      size: 400
      load_threshold: 0.7
      quota_soft: 0.9
      quota_hard: 0.8

runs:
  - name: Run1
    catalyst_factor: 1.3
    guardian_threshold: 0.2
    regulator_policy: soft
  - name: Run2
    catalyst_factor: 1.5
    guardian_threshold: 0.15
    regulator_policy: hard
  - name: Run3
    catalyst_factor: 1.8
    guardian_threshold: 0.25
    regulator_policy: adaptive
